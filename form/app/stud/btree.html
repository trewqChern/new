<!DOCTYPE html>
<html>
  <head>
    <title>Institution Tree of Board</title>
    <meta charset="UTF-8">
    <style>
    body {
      font-family: Arial, sans-serif;
      margin: 15px;
      background: #fafafa;
    }
    .header-banner {
      background-color: #14A44D;
      color: white;
      padding: 10px 15px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .node circle {
      fill: #fff;
      stroke: #14A44D;
      stroke-width: 2px;
      cursor: pointer;
    }
    .node text {
      font: 12px sans-serif;
      cursor: pointer;
    }
    .link {
      fill: none;
      stroke: #bbf7d0;
      stroke-width: 1.5px;
    }
    text:hover {
      opacity: 0.7;
      fill: #14A44D;
    }
    </style>
  </head>
  <body>
    <div class="header-banner">
      <h3 style="margin: 0;">Education Board Institution Tree View</h3>
      <small>Click on any node circle or text to expand / collapse</small>
    </div>

    <script src="../../assets/js/d3.min.js"></script>
    <script>
    function get_var(name, url) {
      if (!url) url = window.location.href;
      name = name.replace(/[\[\]]/g, "\\$&");
      var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
        results = regex.exec(url);
      if (!results) return null;
      if (!results[2]) return '';
      return decodeURIComponent(results[2].replace(/\+/g, " "));
    }

    var board = (get_var('board') || 'DHAKA').toUpperCase();
    var exam = (get_var('exam') || 'SSC').toUpperCase();
    var year = get_var('year') || '2024';

    var margin = {top: 20, right: 120, bottom: 20, left: 160},
        width = 1100 - margin.right - margin.left,
        height = 800 - margin.top - margin.bottom;

    var svg = d3.select("body").append("svg")
        .attr("width", width + margin.right + margin.left)
        .attr("height", height + margin.top + margin.bottom)
      .append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    var i = 0,
        duration = 750,
        root;

    var treemap = d3.tree().size([height, width]);

    // Authentic sample hierarchy for Board
    var flare = {
      "name": "BOARD: " + board + " (" + exam + " " + year + ")",
      "children": [
        {
          "name": "DHAKA MAHANAGARI",
          "children": [
            { "name": "DHANMONDI GOVT. BOYS' HIGH SCHOOL (EIIN: 107960)" },
            { "name": "DHAKA RESIDENTIAL MODEL COLLEGE (EIIN: 108258)" },
            { "name": "GOVT. SCIENCE COLLEGE (EIIN: 108234)" },
            { "name": "NOTRE DAME COLLEGE (EIIN: 108340)" },
            { "name": "VIQARUNNISA NOON SCHOOL & COLLEGE (EIIN: 108339)" }
          ]
        },
        {
          "name": "GAZIPUR",
          "children": [
            { "name": "RANI BILASMONI GOVT. BOYS' HIGH SCHOOL (EIIN: 108955)" },
            { "name": "JOYDEBPUR GOVT. GIRLS' HIGH SCHOOL (EIIN: 108954)" },
            { "name": "KALIGANJ R. R. N. PILOT GOVT. HIGH SCHOOL (EIIN: 109125)" }
          ]
        },
        {
          "name": "NARAYANGANJ",
          "children": [
            { "name": "NARAYANGANJ GOVT. GIRLS' SCHOOL & COLLEGE (EIIN: 112426)" },
            { "name": "MORGAN GIRLS' HIGH SCHOOL (EIIN: 112419)" },
            { "name": "POWER DEV BOARD SECONDARY SCHOOL (EIIN: 112410)" }
          ]
        },
        {
          "name": "TANGAIL",
          "children": [
            { "name": "BINDU BASINI GOVT. BOYS' HIGH SCHOOL (EIIN: 114684)" },
            { "name": "MIRZAPUR GOVT. S. K. PILOT HIGH SCHOOL (EIIN: 114466)" }
          ]
        }
      ]
    };

    root = d3.hierarchy(flare, function(d) { return d.children; });
    root.x0 = height / 2;
    root.y0 = 0;

    function collapse(d) {
      if (d.children) {
        d._children = d.children;
        d._children.forEach(collapse);
        d.children = null;
      }
    }

    if (root.children) {
      root.children.forEach(function(d, idx) {
        if (idx > 0) collapse(d);
      });
    }

    update(root);

    function update(source) {
      var treeData = treemap(root);
      var nodes = treeData.descendants(),
          links = treeData.descendants().slice(1);

      nodes.forEach(function(d){ d.y = d.depth * 250; });

      var node = svg.selectAll('g.node')
          .data(nodes, function(d) {return d.id || (d.id = ++i); });

      var nodeEnter = node.enter().append('g')
          .attr('class', 'node')
          .attr("transform", function(d) {
            return "translate(" + source.y0 + "," + source.x0 + ")";
          })
          .on('click', click);

      nodeEnter.append('circle')
          .attr('class', 'node')
          .attr('r', 1e-6)
          .style("fill", function(d) {
            return d._children ? "#14A44D" : "#fff";
          });

      nodeEnter.append('text')
          .attr("dy", ".35em")
          .attr("x", function(d) {
            return d.children || d._children ? -13 : 13;
          })
          .attr("text-anchor", function(d) {
            return d.children || d._children ? "end" : "start";
          })
          .text(function(d) { return d.data.name; });

      var nodeUpdate = nodeEnter.merge(node);

      nodeUpdate.transition()
        .duration(duration)
        .attr("transform", function(d) { 
          return "translate(" + d.y + "," + d.x + ")";
        });

      nodeUpdate.select('circle.node')
        .attr('r', 8)
        .style("fill", function(d) {
          return d._children ? "#14A44D" : "#fff";
        })
        .attr('cursor', 'pointer');

      var nodeExit = node.exit().transition()
          .duration(duration)
          .attr("transform", function(d) {
            return "translate(" + source.y + "," + source.x + ")";
          })
          .remove();

      nodeExit.select('circle')
          .attr('r', 1e-6);

      nodeExit.select('text')
          .style('fill-opacity', 1e-6);

      var link = svg.selectAll('path.link')
          .data(links, function(d) { return d.id; });

      var linkEnter = link.enter().insert('path', "g")
          .attr("class", "link")
          .attr('d', function(d){
            var o = {x: source.x0, y: source.y0};
            return diagonal(o, o);
          });

      var linkUpdate = linkEnter.merge(link);

      linkUpdate.transition()
          .duration(duration)
          .attr('d', function(d){ return diagonal(d, d.parent); });

      var linkExit = link.exit().transition()
          .duration(duration)
          .attr('d', function(d) {
            var o = {x: source.x, y: source.y};
            return diagonal(o, o);
          })
          .remove();

      nodes.forEach(function(d){
        d.x0 = d.x;
        d.y0 = d.y;
      });

      function diagonal(s, d) {
        return "M " + s.y + " " + s.x +
                "C " + ((s.y + d.y) / 2) + " " + s.x + "," +
                ((s.y + d.y) / 2) + " " + d.x + "," +
                d.y + " " + d.x;
      }

      function click(d) {
        if (d.children) {
          d._children = d.children;
          d.children = null;
        } else {
          d.children = d._children;
          d._children = null;
        }
        update(d);
      }
    }
    </script>
  </body>
</html>
